name: Prepare isolated Azure test image

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Validate with test credentials; creates no Azure resources
        type: boolean
        default: false
      image_digest:
        description: Immutable GHCR digest required for preflight
        type: string
      test_game_origin:
        description: Isolated Azure game origin (reserved default is API-only)
        type: string
        default: https://lpr-game-test.azurestaticapps.net
  push:
    branches: [deploy/azure-test]
    paths: [.github/workflows/publish-azure-test-image.yml]

permissions:
  contents: read

concurrency:
  group: azure-test-image-preparation
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 5ab897e510eb3e1e07cba3c4057c600f5124897f

jobs:
  publish-tested-image:
    if: github.ref == 'refs/heads/deploy/azure-test' && !inputs.preflight_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source and deployment configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          npm run test:azure-verification
          az bicep build --file infra/azure/verification.bicep --outfile "$RUNNER_TEMP/verification.json"
          node tests/azure-deployment.test.cjs "$RUNNER_TEMP/verification.json"
      - name: Build labeled source image
        run: |
          set -euo pipefail
          revision=$(node -p "require('./verification/world.cjs').revision")
          docker build --provenance=false --file Dockerfile.verification \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label org.opencontainers.image.source=https://github.com/panulut/lprmotorsport \
            --label "org.lpr.simulation-revision=$revision" \
            --tag "lpr-verification-test:$SOURCE_COMMIT" .
      - name: Exercise source commit container smoke test
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, pathlib, textwrap
          workflow=pathlib.Path('.github/workflows/azure-verification.yml').read_text()
          block=workflow.split('      - name: Smoke-test container and shutdown\n',1)[1].split('        run: |\n',1)[1]
          lines=[]
          for line in block.splitlines():
              if line.strip() and not line.startswith('          '): break
              lines.append(line)
          script=textwrap.dedent('\n'.join(lines))+'\n'
          assert 'docker stop --time 10' in script and 'assert.equal(h.activeSessions,0)' in script
          script=script.replace('${'+'{ github.sha }}',os.environ['SOURCE_COMMIT'])
          assert '${'+'{' not in script
          pathlib.Path(os.environ['RUNNER_TEMP'],'container-smoke.sh').write_text(script)
          PY
          bash "$RUNNER_TEMP/container-smoke.sh"
      - name: Scan the image that will be published
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: lpr-verification-test:${{ env.SOURCE_COMMIT }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 5m
      - name: Publish tested digest without deploying Azure
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/panulut/lprmotorsport/verification:$SOURCE_COMMIT"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "lpr-verification-test:$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "lpr-verification-test:$SOURCE_COMMIT" "$image"
          docker push "$image"
          digest="ghcr.io/panulut/lprmotorsport/verification@$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^ghcr.io/panulut/lprmotorsport/verification@sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect --raw "$digest" > "$RUNNER_TEMP/published-manifest.json"
          platform_digest=$(node -p "require(process.env.RUNNER_TEMP+'/published-manifest.json').manifests?.find(m=>m.platform?.os==='linux'&&m.platform?.architecture==='amd64')?.digest||''")
          if [ -n "$platform_digest" ]; then
            docker buildx imagetools inspect --raw "ghcr.io/panulut/lprmotorsport/verification@$platform_digest" > "$RUNNER_TEMP/published-manifest.json"
          fi
          config_digest=$(node -p "require(process.env.RUNNER_TEMP+'/published-manifest.json').config.digest")
          docker image save "lpr-verification-test:$SOURCE_COMMIT" --output "$RUNNER_TEMP/tested-image.tar"
          local_config_digest=$(tar --extract --to-stdout --file "$RUNNER_TEMP/tested-image.tar" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('sha256:'+JSON.parse(s)[0].Config.split('/').pop().replace(/\\.json$/,'')))")
          test "$config_digest" = "$local_config_digest"
          {
            echo "Source commit: $SOURCE_COMMIT"
            echo "Simulation revision: $(node -p "require('./verification/world.cjs').revision")"
            echo "Published image: $digest"
            echo "Verified registry config digest: $config_digest"
            echo 'The published image passed container HTTP/session/shutdown tests and the HIGH/CRITICAL vulnerability gate. No Azure login or deployment is performed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

  validate-with-test-credentials:
    if: github.ref == 'refs/heads/deploy/azure-test' && inputs.preflight_only
    name: Validate only - creates no Azure resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate subscription, private image, credentials and provider
        env:
          IMAGE: ${{ inputs.image_digest }}
          GAME_ORIGINS: ${{ inputs.test_game_origin }}
          VERIFICATION_ENVIRONMENT: azure-test
          VERIFICATION_PUBLIC: '1'
          PORT: '8081'
          MAX_VERIFIED_SESSIONS: '2'
          MAX_VERIFIED_STARTS_PER_MINUTE: '100'
          VERIFICATION_SECRET: ${{ secrets.AZURE_VERIFICATION_SECRET }}
          VERIFICATION_METRICS_TOKEN: ${{ secrets.AZURE_METRICS_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = 41128d20-bcb4-4799-80ce-ac23952b4bdd
          test "$(az account show --query name --output tsv)" = 'Azure for Students'
          test "$(az account show --query tenantId --output tsv)" = 9d97530e-8f27-4137-a2a9-5cb4dcf26f2e
          test "$(az group show --name rg-lpr-test --query location --output tsv)" = swedencentral
          export PARAMETERS_FILE=$(mktemp "$RUNNER_TEMP/lpr-preflight.XXXXXX.json")
          trap 'rm -f "$PARAMETERS_FILE"' EXIT
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto'),e=process.env;
          const sha=bytes=>'sha256:'+createHash('sha256').update(bytes).digest('hex');
          (async()=>{
            assert(/^ghcr\.io\/panulut\/lprmotorsport\/verification@sha256:[a-f0-9]{64}$/.test(e.IMAGE),'Unexpected image repository/digest');
            assert(e.GHCR_PULL_TOKEN&&e.GHCR_PULL_USER,'Missing registry credentials');
            assert.notEqual(e.VERIFICATION_SECRET,e.VERIFICATION_METRICS_TOKEN,'Signing/metrics credentials must differ');
            const server=await require('./verification/server.cjs').createServer();
            await server.sessions.close();await server.capacityReporter.close();
            const response=await fetch('https://ghcr.io/token?service=ghcr.io&scope=repository:panulut/lprmotorsport/verification:pull',{
              headers:{Authorization:'Basic '+Buffer.from(e.GHCR_PULL_USER+':'+e.GHCR_PULL_TOKEN).toString('base64')},redirect:'error',signal:AbortSignal.timeout(20000)});
            assert(response.ok,'Registry credential rejected: HTTP '+response.status);
            const auth=await response.json(),headers={Authorization:'Bearer '+(auth.token||auth.access_token)};
            const manifest=await fetch('https://ghcr.io/v2/panulut/lprmotorsport/verification/manifests/'+e.IMAGE.split('@')[1],{
              headers:{...headers,Accept:'application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'},redirect:'error',signal:AbortSignal.timeout(20000)});
            assert(manifest.ok,'Private image pull rejected: HTTP '+manifest.status);
            const bytes=Buffer.from(await manifest.arrayBuffer());assert.equal(sha(bytes),e.IMAGE.split('@')[1]);
            const descriptor=JSON.parse(bytes);assert(descriptor.config?.digest,'Expected a single tested image manifest');
            const blob=await fetch('https://ghcr.io/v2/panulut/lprmotorsport/verification/blobs/'+descriptor.config.digest,{headers,signal:AbortSignal.timeout(20000)});
            assert(blob.ok,'Image configuration unavailable: HTTP '+blob.status);
            const configBytes=Buffer.from(await blob.arrayBuffer());assert.equal(sha(configBytes),descriptor.config.digest);
            const config=JSON.parse(configBytes),labels=config.config.Labels;
            assert.equal(labels['org.opencontainers.image.revision'],'5ab897e510eb3e1e07cba3c4057c600f5124897f');
            assert.equal(labels['org.lpr.simulation-revision'],require('./verification/world.cjs').revision);
            const values={image:e.IMAGE,testGameOrigin:e.GAME_ORIGINS,maxVerifiedSessions:2,maxVerifiedStartsPerMinute:100,
              ghcrUser:e.GHCR_PULL_USER,ghcrPullToken:e.GHCR_PULL_TOKEN,verificationSecret:e.VERIFICATION_SECRET,metricsToken:e.VERIFICATION_METRICS_TOKEN};
            fs.writeFileSync(e.PARAMETERS_FILE,JSON.stringify({parameters:Object.fromEntries(Object.entries(values).map(([k,value])=>[k,{value}]))}),{mode:0o600});
            console.log('PASS: private image credentials, immutable digest, source/revision and isolated two-session startup');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
          az bicep build --file infra/azure/verification.bicep --outfile "$RUNNER_TEMP/verification.json"
          node tests/azure-deployment.test.cjs "$RUNNER_TEMP/verification.json"
          az deployment group validate --subscription 41128d20-bcb4-4799-80ce-ac23952b4bdd \
            --resource-group rg-lpr-test --template-file infra/azure/verification.bicep \
            --parameters "@$PARAMETERS_FILE" --validation-level Provider --only-show-errors --output none
          echo 'PASS: OIDC credential-backed provider preflight; no resources created' >> "$GITHUB_STEP_SUMMARY"
